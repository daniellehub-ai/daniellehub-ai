<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5a68"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="220" fill="none"/>

  <!-- Box 1: Governance -->
  <rect x="20" y="55" width="240" height="110" rx="10" fill="#eef4f7" stroke="#5a8fa8" stroke-width="1.5"/>
  <text x="140" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d38">AI Governance</text>
  <text x="140" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d38">Capstone</text>
  <text x="140" y="135" text-anchor="middle" font-size="11.5" fill="#4a5a68">Risk framework &amp;</text>
  <text x="140" y="150" text-anchor="middle" font-size="11.5" fill="#4a5a68">safeguard design</text>

  <!-- Arrow 1 -->
  <line x1="264" y1="110" x2="322" y2="110" stroke="#4a5a68" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: Red-Teaming -->
  <rect x="330" y="55" width="240" height="110" rx="10" fill="#f2eef7" stroke="#8a6bb0" stroke-width="1.5"/>
  <text x="450" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d38">LLM Red-Teaming</text>
  <text x="450" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d38">Evaluation</text>
  <text x="450" y="135" text-anchor="middle" font-size="11.5" fill="#4a5a68">Adversarial testing &amp;</text>
  <text x="450" y="150" text-anchor="middle" font-size="11.5" fill="#4a5a68">empirical results</text>

  <!-- Arrow 2 -->
  <line x1="574" y1="110" x2="632" y2="110" stroke="#4a5a68" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: Prompt Engineering -->
  <rect x="640" y="55" width="240" height="110" rx="10" fill="#eef7f0" stroke="#5aa87a" stroke-width="1.5"/>
  <text x="760" y="90" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d38">Prompt Engineering</text>
  <text x="760" y="110" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2d38">for Secure AI</text>
  <text x="760" y="135" text-anchor="middle" font-size="11.5" fill="#4a5a68">Design &amp; evaluation</text>
  <text x="760" y="150" text-anchor="middle" font-size="11.5" fill="#4a5a68">discipline underlying both</text>

  <!-- Bottom connector showing repo 3 underlies 1 & 2 -->
  <path d="M 760 165 L 760 195 L 140 195 L 140 165" fill="none" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M 450 165 L 450 195" fill="none" stroke="#9aa7b2" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="450" y="212" text-anchor="middle" font-size="10.5" fill="#7c8a97" font-style="italic">same underlying prompt-design &amp; evaluation discipline</text>
</svg>
